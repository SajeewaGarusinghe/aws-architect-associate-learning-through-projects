<title>IAM Evaluation Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 07</div>
    <h1>IAM Evaluation Drill</h1>
    <p>Twelve scenario questions on policy evaluation, boundaries, roles and cross-account access. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 07 — How IAM actually decides. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "A role has an identity policy allowing `s3:*`. The bucket's resource policy contains an explicit Deny for that role's ARN. The role also has AdministratorAccess attached. Can it read the bucket?",
  "options": [
   "Yes \u2014 AdministratorAccess overrides resource policies",
   "No \u2014 an explicit Deny anywhere overrides every Allow",
   "Yes \u2014 identity policies take precedence over resource policies",
   "Only if the request comes from inside the VPC"
  ],
  "answer": 1,
  "why": "<strong>Explicit deny wins, always.</strong> It is evaluated first and nothing overrides it \u2014 not AdministratorAccess, not the account root, not a resource policy allow. This is the first rule of IAM evaluation and the most reliably tested one."
 },
 {
  "q": "A role has an identity policy allowing `s3:*` and `ec2:*`, and a permission boundary allowing only `s3:Get*` and `s3:List*`. What can the role actually do?",
  "options": [
   "Everything in the identity policy \u2014 boundaries only apply to users",
   "Only s3:Get* and s3:List* \u2014 the intersection of policy and boundary",
   "Everything in the boundary, plus ec2:*",
   "Nothing, because the two conflict"
  ],
  "answer": 1,
  "why": "Effective permissions are the <strong>intersection</strong> of the identity policy and the boundary. The boundary is a ceiling that grants nothing on its own \u2014 every EC2 action and every S3 write falls outside it and is denied, even though the identity policy plainly allows them."
 },
 {
  "q": "A permission boundary allowing `s3:*` is attached to a role that has no identity policy at all. What can the role do?",
  "options": [
   "Everything in S3, since the boundary allows it",
   "Nothing \u2014 a boundary grants no permissions",
   "Only read operations in S3",
   "Everything, because an empty identity policy means unrestricted"
  ],
  "answer": 1,
  "why": "A boundary <strong>only ever subtracts</strong>. With no identity policy there is nothing to intersect with, so the effective permission set is empty and the role can do nothing. Treating a boundary as a way to grant access is the classic misunderstanding."
 },
 {
  "q": "A team must be able to create IAM roles for their applications without being able to grant those roles more access than the security team permits. What is the standard approach?",
  "options": [
   "Grant them iam:* and audit role creation with CloudTrail",
   "Require a permission boundary on any role they create, enforced by a condition on iam:CreateRole",
   "Give them read-only IAM access and create roles on their behalf",
   "Apply a service control policy to their IAM user"
  ],
  "answer": 1,
  "why": "A condition requiring <code>iam:PermissionsBoundary</code> on <code>CreateRole</code> means every role they create is capped, whatever policy they attach. This is the canonical use of boundaries: delegating role creation without enabling privilege escalation. Auditing after the fact does not prevent it."
 },
 {
  "q": "An EC2 instance in Account A must read an S3 bucket in Account B. What is the recommended mechanism?",
  "options": [
   "Create an IAM user in Account B and put its access keys on the instance",
   "A role in Account B that the instance's role assumes, or a bucket policy granting the instance role",
   "Make the bucket public and restrict by IP",
   "Enable cross-region replication into Account A"
  ],
  "answer": 1,
  "why": "Either <strong>cross-account role assumption</strong> \u2014 a role in B trusting A, assumed via STS \u2014 or a <strong>bucket policy in B</strong> naming the instance's role directly. Both avoid long-lived credentials. Access keys on an instance are the anti-pattern the instance role exists to eliminate."
 },
 {
  "q": "The policy simulator reports `implicitDeny` for an action. What does that mean?",
  "options": [
   "A policy explicitly denied the action",
   "No policy allowed the action, so the default deny applies",
   "The simulator could not evaluate the request",
   "A service control policy blocked it"
  ],
  "answer": 1,
  "why": "<strong>Implicit deny</strong> is the default: nothing granted the action. <strong>Explicit deny</strong> means a policy actively forbade it. They need different fixes \u2014 an implicit deny is solved by adding an allow, an explicit deny by finding and removing the Deny statement, which no amount of additional allows will overcome."
 },
 {
  "q": "A company has 40 teams and wants each to manage only its own EC2 instances, without writing 40 policies. Which approach fits best?",
  "options": [
   "One IAM group per team with a team-specific policy",
   "Attribute-based access control using tag conditions",
   "A permission boundary per team",
   "One shared role with a very long policy listing every instance"
  ],
  "answer": 1,
  "why": "<strong>ABAC</strong> matches <code>aws:ResourceTag/team</code> against <code>aws:PrincipalTag/team</code> in a single policy that works for every team \u2014 including teams that do not exist yet. The trade-off is that tagging discipline becomes a security control. Role-per-team is correct but multiplies the policies to maintain."
 },
 {
  "q": "Which credential type does an application running on EC2 receive when it uses an instance profile?",
  "options": [
   "A permanent access key and secret stored in the instance metadata",
   "Temporary credentials that are automatically rotated",
   "The credentials of the user who launched the instance",
   "A password stored in Secrets Manager"
  ],
  "answer": 1,
  "why": "The instance profile delivers <strong>temporary credentials via STS</strong>, retrieved from the instance metadata service and rotated automatically before expiry. Nothing long-lived exists to leak or rotate \u2014 which is exactly why instance roles beat access keys in every scenario the exam presents."
 },
 {
  "q": "An SCP attached to an account denies `s3:DeleteBucket`. A user in that account has AdministratorAccess. Can they delete a bucket?",
  "options": [
   "Yes \u2014 AdministratorAccess is evaluated after SCPs",
   "No \u2014 an SCP sets a ceiling the account cannot exceed, including for root",
   "Only if they use the root user",
   "Only from the AWS console, not the CLI"
  ],
  "answer": 1,
  "why": "A <strong>service control policy</strong> is a ceiling on an entire account in an Organization. It grants nothing and cannot be overridden from inside the account \u2014 <strong>including by the account root user</strong>. Like a permission boundary, it only ever subtracts."
 },
 {
  "q": "A role's trust policy determines what?",
  "options": [
   "What actions the role may perform",
   "Which principals are allowed to assume the role",
   "Which resources the role may access",
   "How long the role's credentials remain valid"
  ],
  "answer": 1,
  "why": "The <strong>trust policy</strong> (the assume-role policy document) says <em>who may become</em> the role. The <strong>permission policy</strong> says <em>what the role may do</em> once assumed. Both must permit the operation: a principal with <code>sts:AssumeRole</code> still fails if the trust policy does not name it."
 },
 {
  "q": "Within a single account, an IAM role has no S3 permissions in its identity policy, but a bucket policy explicitly allows that role to GetObject. Can it read the object?",
  "options": [
   "No \u2014 the identity policy must also allow it",
   "Yes \u2014 within one account, an allow in either policy is sufficient",
   "Only if the bucket is in the same region",
   "Only if the role has s3:ListBucket as well"
  ],
  "answer": 1,
  "why": "<strong>Within the same account</strong>, an allow in the identity policy <em>or</em> the resource policy is enough. This is why S3 access can appear from nowhere when reading only the identity side. <strong>Cross-account is different</strong>: both the resource policy in the target account and the identity policy in the caller's account must allow it."
 },
 {
  "q": "What is the practical difference between an IAM role and an IAM user?",
  "options": [
   "Roles are for AWS services, users are for people \u2014 nothing else differs",
   "A user has long-lived credentials; a role is assumed and issues temporary credentials",
   "Roles cannot have policies attached",
   "Users can be assumed by services, roles cannot"
  ],
  "answer": 1,
  "why": "A <strong>user</strong> is an identity with long-lived credentials \u2014 a password and/or access keys. A <strong>role</strong> has no credentials of its own: principals assume it and receive temporary STS credentials that expire. Current best practice is to avoid users almost entirely, using federation or instance/service roles instead."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
