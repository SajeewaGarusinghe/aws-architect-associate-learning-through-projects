<title>Serverless Exam Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 04</div>
    <h1>Serverless Exam Drill</h1>
    <p>Twelve scenario questions on Lambda, API Gateway, DynamoDB and the per-request cost model. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 04 — The serverless API. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "An internal reporting tool is used heavily for two hours each morning and sits completely idle the rest of the day. The team wants to minimise cost. Which architecture best fits?",
  "options": [
   "EC2 instances in an Auto Scaling group with scheduled scaling",
   "API Gateway with Lambda and DynamoDB on-demand",
   "An Application Load Balancer in front of two reserved t3.medium instances",
   "ECS on Fargate with a minimum task count of two"
  ],
  "answer": 1,
  "why": "Serverless charges nothing while idle, which is the dominant cost factor for a workload idle 22 hours a day. The exam signals this with the words <strong>spiky, unpredictable, intermittent or infrequent</strong>. The corollary matters too: at sustained high volume, EC2 and provisioned capacity become cheaper again, so \"steady predictable load\" points the other way."
 },
 {
  "q": "A DynamoDB table stores millions of orders with partition key customerId and sort key orderDate. A query retrieving one customer's orders is fast and cheap, but a report filtering all orders by status is slow and expensive. Why?",
  "options": [
   "The table needs provisioned capacity rather than on-demand",
   "Filtering by a non-key attribute requires a Scan, which reads every item in the table",
   "The sort key should be status rather than orderDate",
   "DynamoDB cannot filter on non-key attributes at all"
  ],
  "answer": 1,
  "why": "A <strong>Scan reads every item in the table</strong> and then discards the non-matching ones \u2014 and you are billed for everything read, not for what comes back. Cost and latency grow with total table size forever. The fix is a <strong>global secondary index</strong> on status, which gives a Query-able access pattern. Changing the table's own sort key would break the existing query."
 },
 {
  "q": "A Lambda function creates a database connection object. A developer moves that creation from inside the handler to the module level, outside it. What is the effect?",
  "options": [
   "The connection is created once per request, increasing latency",
   "The connection is created once per execution environment and reused across warm invocations",
   "The connection is created once per account and shared between functions",
   "The function will fail because module-level code cannot make network calls"
  ],
  "answer": 1,
  "why": "Code outside the handler runs during the <strong>initialisation phase</strong>, once per execution environment \u2014 not once per request. Warm invocations reuse it, which is why moving expensive setup out of the handler is the standard Lambda optimisation. The tradeoff is that the init cost lands on the cold start instead."
 },
 {
  "q": "A team needs API keys with usage plans, request validation, and integration with AWS WAF. Which API Gateway type should they choose?",
  "options": [
   "HTTP API, which is cheaper and faster",
   "REST API, which supports these features",
   "WebSocket API",
   "Either \u2014 the two are functionally identical"
  ],
  "answer": 1,
  "why": "<strong>REST APIs</strong> support API keys with usage plans, request/response transformation, request validation, WAF integration, caching and private endpoints. <strong>HTTP APIs</strong> are roughly 70% cheaper and lower latency but omit those features. On the exam, any mention of API keys, usage plans, request validation or WAF points to REST."
 },
 {
  "q": "A Lambda function must read from an S3 bucket. What is the correct way to give it access?",
  "options": [
   "Store IAM access keys in the function's environment variables",
   "Attach an execution role with an s3:GetObject policy scoped to that bucket",
   "Place the function in the same VPC as the bucket",
   "Add the function's IP address to the bucket policy"
  ],
  "answer": 1,
  "why": "Lambda assumes its <strong>execution role</strong> and receives temporary credentials automatically \u2014 no long-lived keys should exist anywhere. Scope the policy to the specific bucket ARN rather than <code>s3:*</code> on <code>*</code>. S3 is not in a VPC, and Lambda has no stable IP address to allow-list."
 },
 {
  "q": "An application experiences a sudden traffic spike and some API calls return HTTP 429. The Lambda function itself is healthy and its code is unchanged. What is the most likely cause?",
  "options": [
   "The function timed out at 15 minutes",
   "Concurrent executions hit the account or reserved concurrency limit, so invocations were throttled",
   "The execution role lost its permissions",
   "The function ran out of memory"
  ],
  "answer": 1,
  "why": "429 means <strong>throttling</strong>. Lambda scales concurrent executions to an account limit \u2014 1,000 by default \u2014 and a reserved concurrency setting on the function caps it lower. Timeouts surface as 502/504 and appear in the logs as a timeout; out-of-memory kills the invocation with a specific error. Fixes are raising the limit, reserved concurrency, or provisioned concurrency."
 },
 {
  "q": "A team wants to eliminate cold-start latency for a latency-sensitive Lambda function. What should they use, and what is the tradeoff?",
  "options": [
   "Reserved concurrency \u2014 it caps cost but does not affect cold starts",
   "Provisioned concurrency \u2014 it keeps environments initialised, but bills hourly",
   "Increasing the timeout \u2014 it gives the function more time to initialise",
   "Attaching the function to a VPC \u2014 it keeps network interfaces warm"
  ],
  "answer": 1,
  "why": "<strong>Provisioned concurrency</strong> keeps a set number of execution environments initialised and ready, eliminating cold starts for that many concurrent invocations \u2014 but it bills for that capacity by the hour, which gives up the zero-idle-cost property that makes serverless attractive. <strong>Reserved</strong> concurrency does something entirely different: it caps how many concurrent executions a function may use."
 },
 {
  "q": "What is the maximum execution time for a single Lambda invocation?",
  "options": [
   "5 minutes",
   "15 minutes",
   "1 hour",
   "Unlimited, as long as the function reports progress"
  ],
  "answer": 1,
  "why": "<strong>15 minutes.</strong> Any workload needing longer must move to Fargate, ECS, Batch or EC2, or be decomposed into steps coordinated by Step Functions. This limit is a common exam discriminator \u2014 a question describing a four-hour batch job is ruling Lambda out."
 },
 {
  "q": "A DynamoDB table's traffic is completely unpredictable, swinging between zero and thousands of requests per second with no pattern. Which capacity mode is appropriate?",
  "options": [
   "Provisioned capacity with auto scaling",
   "On-demand capacity",
   "Provisioned capacity with reserved capacity purchased upfront",
   "Provisioned capacity sized for the peak"
  ],
  "answer": 1,
  "why": "<strong>On-demand</strong> charges per request with no capacity planning and absorbs sudden spikes instantly \u2014 the right fit for unpredictable traffic. Provisioned auto scaling reacts over minutes and can throttle during a sharp spike. Provisioning for peak wastes money constantly. On-demand costs more per request at steady high volume, which is when provisioned wins."
 },
 {
  "q": "A Lambda function returns 500 errors. CloudWatch Logs shows: \"AccessDeniedException \u2026 is not authorized to perform: dynamodb:Query on resource: arn:aws:dynamodb:\u2026:table/orders\". What does this tell you?",
  "options": [
   "The table does not exist",
   "The execution role's policy does not permit the Query action on that table",
   "The function is not attached to the correct VPC",
   "DynamoDB is throttling the request"
  ],
  "answer": 1,
  "why": "An <code>AccessDeniedException</code> names three things: <strong>who</strong> (the assumed role), <strong>what action</strong> (<code>dynamodb:Query</code>) and <strong>which resource</strong> (the table ARN). Here the role is missing Query on that table \u2014 note that other actions such as PutItem may still work, because IAM is evaluated per action. A missing table gives ResourceNotFoundException; throttling gives ProvisionedThroughputExceededException."
 },
 {
  "q": "A Lambda function is created and invoked without an explicitly declared CloudWatch log group. What is the cost risk?",
  "options": [
   "Logs are not captured at all, so failures go unnoticed",
   "Lambda creates the log group with retention set to never expire, and it accumulates storage charges indefinitely",
   "Each invocation creates a new log group",
   "Log ingestion is billed at double the normal rate"
  ],
  "answer": 1,
  "why": "Lambda creates the log group implicitly on first invocation with <strong>retention set to never expire</strong>. Logs accumulate storage charges for the life of the account unless someone notices. Declaring the log group in the template with an explicit <code>RetentionInDays</code> \u2014 as this lab does \u2014 is the fix, and it is a genuinely common source of unexplained CloudWatch charges."
 },
 {
  "q": "How does API Gateway obtain permission to invoke a Lambda function?",
  "options": [
   "The function's execution role includes a lambda:InvokeFunction statement",
   "A resource-based policy on the function grants the apigateway.amazonaws.com service principal",
   "Both must be placed in the same VPC and security group",
   "API Gateway uses the credentials of the user who deployed the API"
  ],
  "answer": 1,
  "why": "A <strong>resource-based policy</strong> on the function grants the API Gateway service principal permission to invoke it, scoped to the specific API's ARN. This is the inverse of an execution role: the execution role says what the function may do, while the resource policy says who may call it. There is no network relationship between the two services at all."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
