<title>Decoupling Exam Drill</title>

<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 05</div>
    <h1>Decoupling Exam Drill</h1>
    <p>Twelve scenario questions on SQS, SNS, dead-letter queues and asynchronous design. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 05 — Decoupling with queues. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "An order service must notify three separate downstream systems whenever an order is placed. Each system must receive every order and process it independently at its own pace. What is the appropriate design?",
  "options": [
   "One SQS queue that all three systems poll",
   "An SNS topic with three subscribed SQS queues, one per system",
   "Three Lambda functions invoked directly by the order service",
   "An SNS topic with all three systems subscribed by HTTP endpoint"
  ],
  "answer": 1,
  "why": "A standard SQS queue delivers each message to <strong>one</strong> consumer \u2014 three systems polling one queue would <em>split</em> the orders, not each receive a copy. SNS fan-out to one queue per subscriber gives each system its own buffer, retries and dead-letter behaviour. HTTP subscribers would receive the message but get no queue, so an outage loses it."
 },
 {
  "q": "A Lambda function consuming from SQS has a 60-second timeout. The queue's visibility timeout is 30 seconds. What is the likely consequence?",
  "options": [
   "Messages are deleted before processing completes",
   "The same message is delivered to a second invocation while the first is still running",
   "The function is throttled to match the visibility timeout",
   "Messages go straight to the dead-letter queue"
  ],
  "answer": 1,
  "why": "The message becomes visible again after 30 seconds \u2014 <strong>while the first invocation is still working</strong> \u2014 so a second consumer picks it up and the work happens twice, with no error anywhere to reveal it. The rule is <strong>visibility timeout \u2265 function timeout</strong>, conventionally six times it."
 },
 {
  "q": "A message in an SQS queue cannot be processed successfully \u2014 it fails every time. Without a dead-letter queue configured, what happens?",
  "options": [
   "SQS deletes it after three attempts",
   "It is retried until the message retention period expires, up to 14 days",
   "It blocks the queue permanently and no other message is processed",
   "It is moved to a hidden quarantine queue automatically"
  ],
  "answer": 1,
  "why": "Without a redrive policy the message keeps returning to the queue until <strong>message retention</strong> expires \u2014 default 4 days, maximum 14. It consumes invocations and fills logs the whole time. With a small batch size it can also delay messages behind it, though it does not block the queue permanently."
 },
 {
  "q": "An SNS topic has two SQS subscribers. One should receive only messages where a `priority` attribute equals `high`. What is the most efficient way to achieve this?",
  "options": [
   "Filter inside the consumer and discard unwanted messages",
   "Apply a filter policy to that subscription",
   "Create a second topic and publish to both",
   "Use a FIFO topic with message group IDs"
  ],
  "answer": 1,
  "why": "A <strong>filter policy</strong> is evaluated at SNS, so non-matching messages are never delivered to that queue and the consumer is never invoked for them \u2014 cheaper and simpler than filtering in code. Filtering in the consumer means paying to receive and discard. A second topic makes the publisher aware of the routing again."
 },
 {
  "q": "What delivery guarantee does a standard SQS queue provide?",
  "options": [
   "Exactly once, in the order sent",
   "At least once, with best-effort ordering",
   "At most once, with guaranteed ordering",
   "Exactly once, with no ordering guarantee"
  ],
  "answer": 1,
  "why": "Standard queues guarantee <strong>at least once</strong> delivery with best-effort ordering \u2014 a message can be delivered more than once and out of order. Consumers must therefore be <strong>idempotent</strong>. FIFO queues provide exactly-once processing and strict ordering, at much lower throughput."
 },
 {
  "q": "An application must process financial transactions in the exact order submitted, with no duplicates. Which service configuration is appropriate?",
  "options": [
   "A standard SQS queue with a Lambda consumer",
   "An SQS FIFO queue with message group IDs",
   "An SNS standard topic with an SQS subscriber",
   "A standard queue with a 0-second visibility timeout"
  ],
  "answer": 1,
  "why": "<strong>FIFO queues</strong> give strict ordering within a message group and exactly-once processing inside a 5-minute deduplication window. The cost is throughput \u2014 300 messages/second, or 3,000 with batching, versus effectively unlimited for standard. Order is preserved <em>per message group</em>, so the group ID choice determines how much parallelism remains."
 },
 {
  "q": "A Lambda function consuming SQS catches all exceptions and returns normally, logging failures. Messages that fail are never retried and never reach the dead-letter queue. Why?",
  "options": [
   "The DLQ redrive policy is misconfigured",
   "Returning without raising tells Lambda the batch succeeded, so the messages are deleted",
   "Lambda only retries on timeout, not on exceptions",
   "The visibility timeout is too short"
  ],
  "answer": 1,
  "why": "Lambda's managed poller deletes messages when the handler <strong>returns without raising</strong>. Swallowing the exception is therefore indistinguishable from success: the data is silently discarded, the queue looks healthy, and the DLQ stays empty. Failure must propagate as a raised exception \u2014 or be reported via batch item failures for partial batches."
 },
 {
  "q": "A queue receives a large burst of messages, and the Lambda consumer scales up to hundreds of concurrent executions, overwhelming a downstream database. What is the appropriate control?",
  "options": [
   "Reduce the queue's message retention period",
   "Set reserved concurrency on the consuming function",
   "Increase the visibility timeout",
   "Switch the queue to FIFO"
  ],
  "answer": 1,
  "why": "<strong>Reserved concurrency</strong> caps how many instances of the function may run at once, so the queue absorbs the burst while the database sees a bounded rate \u2014 which is exactly the buffering a queue exists to provide. Retention and visibility timeout do not limit concurrency. FIFO would serialise things but for the wrong reason and at a heavy throughput cost."
 },
 {
  "q": "What is the main cost benefit of long polling on an SQS queue?",
  "options": [
   "It reduces the per-message storage charge",
   "It reduces the number of empty ReceiveMessage responses, which are billable requests",
   "It compresses messages in transit",
   "It allows a larger batch size"
  ],
  "answer": 1,
  "why": "Short polling returns immediately even when the queue is empty, and <strong>every empty receive is a billable request</strong>. Long polling \u2014 <code>ReceiveMessageWaitTimeSeconds</code> up to 20 \u2014 waits for a message to arrive, cutting empty receives dramatically. It also reduces latency, since the message is returned the moment it lands."
 },
 {
  "q": "An SNS topic delivers to an HTTP endpoint that is down for an hour. What happens to messages published during that window, with no dead-letter queue configured on the subscription?",
  "options": [
   "They are queued in SNS and delivered when the endpoint recovers",
   "They are retried according to the delivery policy and then discarded",
   "They are stored for 14 days like SQS messages",
   "Publishing fails and the publisher receives an error"
  ],
  "answer": 1,
  "why": "<strong>SNS is push-based and does not store messages indefinitely.</strong> It retries per the delivery policy and then drops them unless the subscription has a dead-letter queue. This is precisely why the SNS-to-SQS pattern exists: the queue provides the durable buffer that a raw HTTP subscription does not."
 },
 {
  "q": "What does a redrive policy with `maxReceiveCount` set to 3 actually count?",
  "options": [
   "The number of seconds a message may remain invisible",
   "The number of times a message has been received before being moved to the DLQ",
   "The number of consumers permitted to read the queue",
   "The number of retries per second allowed"
  ],
  "answer": 1,
  "why": "It counts <strong>receives</strong>, tracked as <code>ApproximateReceiveCount</code> on each message. When a message has been received more than <code>maxReceiveCount</code> times without being deleted, SQS moves it to the dead-letter queue instead of making it visible again. The interval between attempts is the visibility timeout, not a backoff setting."
 },
 {
  "q": "A workload needs to route events to different targets based on the content of the event, with rules that change frequently and may match on many fields. Which service fits best?",
  "options": [
   "SNS with filter policies",
   "Amazon EventBridge",
   "SQS with multiple queues",
   "Step Functions"
  ],
  "answer": 1,
  "why": "<strong>EventBridge</strong> is the event bus built for content-based routing: rich rule patterns over the event body, many target types, schema registry, and third-party SaaS sources. SNS filter policies work on message <em>attributes</em> and suit simpler cases. Step Functions orchestrate multi-step workflows rather than route events."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
