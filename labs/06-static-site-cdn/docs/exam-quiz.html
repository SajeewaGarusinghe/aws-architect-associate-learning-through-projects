<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 06</div>
    <h1>S3 And CloudFront Drill</h1>
    <p>Twelve scenario questions on S3 storage classes, bucket security and CloudFront behaviour. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 06 — Static site on S3 behind CloudFront. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "A static website is served by CloudFront from an S3 origin. Security requires that the bucket never be publicly accessible, while the site stays reachable. What should be configured?",
  "options": [
   "Enable S3 static website hosting and make the bucket public",
   "Use Origin Access Control and a bucket policy naming the CloudFront service principal",
   "Place the bucket in a private subnet",
   "Use a bucket ACL granting read to AuthenticatedUsers"
  ],
  "answer": 1,
  "why": "<strong>Origin Access Control</strong> signs origin requests with SigV4, and the bucket policy allows <code>s3:GetObject</code> to the CloudFront service principal conditioned on the specific distribution ARN. All four public-access blocks stay on. S3 is not in a VPC, so subnets are irrelevant; <code>AuthenticatedUsers</code> means any AWS user anywhere, which is a classic wrong answer."
 },
 {
  "q": "A CloudFront distribution returns 403 Access Denied for a URL path that does not exist in the S3 bucket, instead of a 404. Why?",
  "options": [
   "The distribution is misconfigured and must be redeployed",
   "S3 returns 403 rather than 404 for a missing key when the caller lacks s3:ListBucket",
   "CloudFront caches 404 responses as 403",
   "The bucket policy is missing s3:GetObject"
  ],
  "answer": 1,
  "why": "S3 deliberately returns <strong>403 for a nonexistent key</strong> when the caller has no <code>s3:ListBucket</code> permission \u2014 revealing whether an object exists would itself leak information. A CloudFront custom error response mapping 403 to your 404 page is the standard fix, and this trips people constantly when debugging static sites."
 },
 {
  "q": "Data must be retained for compliance for seven years, is essentially never accessed, and a retrieval time of twelve hours is acceptable. Which storage class minimises cost?",
  "options": [
   "S3 Standard-Infrequent Access",
   "S3 Glacier Deep Archive",
   "S3 Glacier Instant Retrieval",
   "S3 Intelligent-Tiering"
  ],
  "answer": 1,
  "why": "<strong>Glacier Deep Archive</strong> is the cheapest S3 storage, designed for long-term retention with retrieval measured in hours and a 180-day minimum duration. Glacier Instant Retrieval costs more because it offers millisecond access. Standard-IA is far more expensive for data never read. Intelligent-Tiering suits <em>unknown or changing</em> access patterns, not a known-cold one."
 },
 {
  "q": "An application's access pattern is unpredictable \u2014 some objects are read constantly, others not for months, and it changes over time. Which storage class is appropriate?",
  "options": [
   "S3 Standard for everything",
   "S3 Intelligent-Tiering",
   "S3 One Zone-IA",
   "A lifecycle policy moving everything to Glacier after 30 days"
  ],
  "answer": 1,
  "why": "<strong>Intelligent-Tiering</strong> moves objects between access tiers automatically based on observed usage, for a small per-object monitoring fee and no retrieval charges in the frequent and infrequent tiers. Whenever a question describes an access pattern as unknown, unpredictable or changing, this is the intended answer."
 },
 {
  "q": "After uploading a corrected index.html to the origin bucket, viewers still receive the old content. What explains this?",
  "options": [
   "S3 is eventually consistent for overwrites",
   "Edge locations serve the cached object until its TTL expires or an invalidation is issued",
   "The bucket policy caches the old object",
   "Versioning is serving the previous version"
  ],
  "answer": 1,
  "why": "CloudFront caches at edge locations for the TTL set by the cache policy \u2014 with <code>CachingOptimized</code> the default is 24 hours. Uploading to the origin does not notify the edges. Either invalidate the path or, better, use <strong>versioned object names</strong> so every deploy is a new object and no invalidation is needed. S3 has been strongly consistent since 2020."
 },
 {
  "q": "A bucket has versioning enabled. A user deletes an object. What actually happens?",
  "options": [
   "The object and all its versions are permanently removed",
   "A delete marker becomes the current version and previous versions remain",
   "The object moves to Glacier automatically",
   "The delete is rejected until versioning is suspended"
  ],
  "answer": 1,
  "why": "A delete on a versioned bucket writes a <strong>delete marker</strong> as the new current version; every prior version remains and is billable. Removing the delete marker restores the object. This also means a versioned bucket is not empty just because objects look deleted \u2014 which is why teardown must remove versions and delete markers."
 },
 {
  "q": "Content must be served only to users who have paid, with access expiring after 24 hours. What is the appropriate CloudFront mechanism?",
  "options": [
   "Origin Access Control",
   "Signed URLs or signed cookies",
   "A bucket policy restricting by IP address",
   "Geo-restriction"
  ],
  "answer": 1,
  "why": "<strong>Signed URLs</strong> (one file) and <strong>signed cookies</strong> (many files or a whole area of a site) grant time-limited access to specific content. OAC controls how CloudFront reaches the <em>origin</em>, not who may reach CloudFront. Geo-restriction filters by country, not by entitlement."
 },
 {
  "q": "An S3 bucket in ap-southeast-2 serves large files to users in Europe, who report slow uploads. Which feature most directly addresses upload speed?",
  "options": [
   "CloudFront with a longer TTL",
   "S3 Transfer Acceleration",
   "Cross-Region Replication",
   "Multipart download"
  ],
  "answer": 1,
  "why": "<strong>Transfer Acceleration</strong> routes uploads to the nearest CloudFront edge and carries them over the AWS backbone to the bucket, which helps most over long distances. CloudFront accelerates <em>downloads</em>, not uploads. Cross-Region Replication copies objects after they arrive, so it does not help the upload itself."
 },
 {
  "q": "Which statement about S3 One Zone-IA is correct?",
  "options": [
   "It replicates across three availability zones like Standard",
   "It stores data in a single AZ and is unsuitable for data that cannot be recreated",
   "It has the same durability as Standard but slower retrieval",
   "It is the cheapest class for archival data"
  ],
  "answer": 1,
  "why": "<strong>One Zone-IA stores data in a single availability zone</strong>: roughly 20% cheaper than Standard-IA, and the data is lost if that AZ is destroyed. It suits easily recreatable data such as derived thumbnails or secondary copies \u2014 never the only copy of anything important."
 },
 {
  "q": "A company wants to ensure no bucket in the account can ever be made public, even if someone later attaches a permissive bucket policy. What provides this?",
  "options": [
   "A lifecycle policy",
   "S3 Block Public Access settings at the account level",
   "Bucket versioning",
   "Default encryption"
  ],
  "answer": 1,
  "why": "<strong>Block Public Access</strong> is a backstop that overrides bucket policies and ACLs \u2014 with it enabled, a policy granting public access is simply refused. Applied at the account level it covers every bucket including future ones. This is the single most effective control against accidental S3 exposure."
 },
 {
  "q": "CloudFront must serve content over HTTPS using a custom domain name. Where must the ACM certificate be requested?",
  "options": [
   "In the same region as the origin bucket",
   "In us-east-1, regardless of where other resources are",
   "In any region, CloudFront replicates it",
   "Certificates cannot be used with CloudFront"
  ],
  "answer": 1,
  "why": "A certificate used by CloudFront must be in <strong>us-east-1 (N. Virginia)</strong>, because CloudFront is a global service managed from that region. A certificate for an Application Load Balancer, by contrast, must be in the load balancer's own region. This asymmetry is a reliable exam detail."
 },
 {
  "q": "What is the main cost difference between a CloudFront cache hit and a cache miss?",
  "options": [
   "A hit costs more because edge storage is billed",
   "A miss adds an origin request and origin data transfer on top of the edge delivery",
   "There is no cost difference",
   "A miss is free because the origin serves it"
  ],
  "answer": 1,
  "why": "A <strong>hit</strong> is served from the edge and costs the request plus data transfer out. A <strong>miss</strong> adds an S3 GET request and origin-to-edge transfer. This is why cache hit ratio is the main CloudFront cost lever \u2014 and why offloading traffic from the origin is a cost benefit as much as a latency one."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
