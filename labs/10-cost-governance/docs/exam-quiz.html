<title>Governance And Cost Drill</title>

<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 10</div>
    <h1>Governance And Cost Drill</h1>
    <p>Twelve scenario questions on CloudTrail, Config, CloudWatch, budgets and pricing models. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 10 — Who did it, and what it cost. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "A security team needs to know which IAM user deleted a production S3 bucket last Tuesday, and from what IP address. Which service answers this?",
  "options": [
   "AWS Config",
   "AWS CloudTrail",
   "Amazon CloudWatch",
   "AWS Trusted Advisor"
  ],
  "answer": 1,
  "why": "<strong>CloudTrail is a ledger of API calls</strong> \u2014 who, when, from where, and what parameters. Config records resource <em>state</em> and would show the bucket vanished, but not who did it. CloudWatch records metrics and logs about behaviour. Any question with \"who\", \"when\" or \"which user\" is CloudTrail."
 },
 {
  "q": "A compliance team needs a continuously updated list of which security groups currently allow unrestricted inbound SSH. Which service is designed for this?",
  "options": [
   "CloudTrail with an event filter",
   "AWS Config with a managed rule",
   "CloudWatch Logs Insights",
   "Amazon Inspector"
  ],
  "answer": 1,
  "why": "<strong>Config evaluates current resource state against rules</strong> and reports compliant or non-compliant, with configuration history. The managed rule here is <code>INCOMING_SSH_DISABLED</code>. CloudTrail would show the API call that opened the port, but cannot list what is open right now."
 },
 {
  "q": "A CloudTrail trail is created in ap-southeast-2 only. An engineer makes changes in us-east-1. What happens?",
  "options": [
   "The changes are recorded, because CloudTrail is always global",
   "The changes are not recorded by that trail unless it is multi-region",
   "The changes are recorded but only for 90 days",
   "CloudTrail automatically creates a trail in the new region"
  ],
  "answer": 1,
  "why": "A single-region trail records only that region's events, so activity elsewhere is invisible to it. <strong>Always create multi-region trails</strong>, and enable global service events. Note that the console's 90-day Event History exists in every region regardless, which sometimes masks the gap until an audit."
 },
 {
  "q": "A company enables CloudTrail data events for all S3 buckets and receives an unexpectedly large bill. Why?",
  "options": [
   "Management events are charged per event",
   "Data events log every object-level operation, which on busy buckets is millions of events",
   "Multi-region trails cost double",
   "Log file validation adds a per-event charge"
  ],
  "answer": 1,
  "why": "The first copy of <strong>management events</strong> is free. <strong>Data events</strong> \u2014 every GetObject, PutObject, Lambda invoke \u2014 are charged per event and are the standard cause of a shocking CloudTrail bill. Enable them selectively, on the buckets that actually need object-level auditing."
 },
 {
  "q": "Which budget notification type warns you before the money is spent?",
  "options": [
   "ACTUAL at 100%",
   "FORECASTED at 100%",
   "ACTUAL at 80%",
   "Neither \u2014 budgets only report after the fact"
  ],
  "answer": 1,
  "why": "A <strong>FORECASTED</strong> notification projects the month's trend and fires when the projection crosses the threshold \u2014 before the spend happens, which is the only alert that leaves time to act. ACTUAL alerts fire after the money is gone, and are the backstop for a spike the forecast has not caught."
 },
 {
  "q": "A workload runs 24/7 with predictable, steady usage for the next three years. Which pricing model minimises cost?",
  "options": [
   "On-demand instances",
   "A Compute Savings Plan or Reserved Instances",
   "Spot instances",
   "Dedicated hosts"
  ],
  "answer": 1,
  "why": "<strong>Savings Plans and Reserved Instances</strong> trade a one- or three-year commitment for up to ~72% off \u2014 the right answer whenever usage is described as steady and predictable. Spot suits interruptible work. Dedicated hosts address licensing and compliance isolation, not cost."
 },
 {
  "q": "A batch job can be interrupted and restarted at any time, and runs whenever capacity is cheap. Which purchasing option fits?",
  "options": [
   "Reserved Instances",
   "Spot Instances",
   "On-demand with an Auto Scaling group",
   "Savings Plans"
  ],
  "answer": 1,
  "why": "<strong>Spot</strong> offers up to 90% off spare capacity, reclaimed with a two-minute warning \u2014 ideal for fault-tolerant, interruptible work such as batch processing, CI and rendering. The exam signals Spot with \"interruptible\", \"fault-tolerant\", \"flexible start and end times\"."
 },
 {
  "q": "An organisation must prevent any member account from disabling CloudTrail, including by the account's root user. What achieves this?",
  "options": [
   "An IAM policy denying cloudtrail:StopLogging on each account's admin role",
   "A service control policy in AWS Organizations",
   "A permission boundary applied to all roles",
   "Enabling log file validation"
  ],
  "answer": 1,
  "why": "A <strong>service control policy</strong> is a ceiling on an entire account and <strong>applies to the root user too</strong>. IAM policies can be edited by an account administrator. A permission boundary only affects principals that carry it. Log file validation detects tampering but does not prevent stopping the trail."
 },
 {
  "q": "Which statement correctly distinguishes CloudWatch from CloudTrail?",
  "options": [
   "CloudWatch records API calls; CloudTrail records metrics",
   "CloudWatch records metrics and logs about behaviour; CloudTrail records who made which API calls",
   "They are the same service under different names",
   "CloudWatch is for billing; CloudTrail is for performance"
  ],
  "answer": 1,
  "why": "<strong>CloudWatch</strong> answers how busy, how slow, how many errors \u2014 metrics, logs and alarms about behaviour. <strong>CloudTrail</strong> answers who called what, and when. <strong>Config</strong> is the third: what a resource looks like now and whether that is allowed. Questions routinely offer one when they need another."
 },
 {
  "q": "A company wants to allocate AWS costs to individual teams. What is the prerequisite?",
  "options": [
   "Separate AWS accounts for every team",
   "A consistent tagging strategy with cost allocation tags activated",
   "Enabling CloudTrail data events",
   "Purchasing Reserved Instances per team"
  ],
  "answer": 1,
  "why": "<strong>Cost allocation tags</strong> \u2014 activated in the billing console and applied consistently \u2014 let Cost Explorer and billing reports break spend down by team, project or environment. Separate accounts also work and give harder boundaries, but tagging is the prerequisite either way, and an untagged resource is unattributable."
 },
 {
  "q": "Which statement about AWS Config pricing is correct?",
  "options": [
   "It is free for the first 100 rules",
   "It charges per configuration item recorded and per rule evaluation",
   "It charges a flat monthly fee per region",
   "It is included with a Business support plan"
  ],
  "answer": 1,
  "why": "Config bills roughly <strong>$0.003 per configuration item recorded</strong> plus about $0.001 per rule evaluation. Recording <code>AllSupported</code> resource types in a busy account generates items on every change and is a common source of unexpected charges \u2014 which is why this lab scopes the recorder to four types."
 },
 {
  "q": "Which service provides recommendations across cost, performance, security, fault tolerance and service limits?",
  "options": [
   "AWS Config",
   "AWS Trusted Advisor",
   "AWS Compute Optimizer",
   "Amazon Inspector"
  ],
  "answer": 1,
  "why": "<strong>Trusted Advisor</strong> spans five pillars, though the full check set requires a Business or Enterprise support plan. <strong>Compute Optimizer</strong> is narrower and deeper: right-sizing recommendations for EC2, EBS, Lambda and ECS based on observed utilisation. Inspector scans workloads for vulnerabilities."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
