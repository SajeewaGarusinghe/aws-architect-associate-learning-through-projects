<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 09</div>
    <h1>Caching And Performance Drill</h1>
    <p>Twelve scenario questions on caching layers, ElastiCache, VPC endpoints and Lambda networking. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 09 — Cache-aside, measured. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "A Lambda function is attached to a VPC so it can reach an ElastiCache cluster. It must also read from DynamoDB. What is the cheapest way to give it that access?",
  "options": [
   "A NAT gateway in a public subnet",
   "A DynamoDB gateway endpoint in the private route table",
   "An interface endpoint for DynamoDB in each subnet",
   "An internet gateway with a public IP on the function"
  ],
  "answer": 1,
  "why": "A <strong>gateway endpoint is free</strong> \u2014 it is a prefix-list route, not an ENI \u2014 and exists for exactly two services: <strong>S3 and DynamoDB</strong>. A NAT gateway would cost $0.059/hour to send AWS traffic out to the internet and back. Interface endpoints bill hourly per AZ. Lambda functions cannot have public IPs."
 },
 {
  "q": "An application caches query results in Redis with a 60-second TTL. What does the TTL primarily control?",
  "options": [
   "How much memory the cache may use",
   "The maximum time a reader may see data that no longer matches the database",
   "How long a client waits before timing out",
   "How frequently the cache replicates to its replica"
  ],
  "answer": 1,
  "why": "The TTL is the <strong>staleness bound</strong> \u2014 the contract about how out of date an answer may be. Choosing it is a business decision, not a technical one: how wrong can this value be before it matters? Memory pressure is handled separately by the eviction policy."
 },
 {
  "q": "A team needs a cache supporting replication, Multi-AZ automatic failover, sorted sets for a leaderboard, and pub/sub. Which engine fits?",
  "options": [
   "Memcached",
   "Redis",
   "DynamoDB DAX",
   "CloudFront"
  ],
  "answer": 1,
  "why": "<strong>Redis</strong> supports replication, Multi-AZ failover, persistence, transactions and rich data structures including sorted sets and pub/sub. <strong>Memcached</strong> is a simple multi-threaded key/value cache with no persistence, replication or failover. Leaderboards, pub/sub and high availability all point to Redis."
 },
 {
  "q": "In the cache-aside pattern, what happens when the cache becomes unavailable?",
  "options": [
   "The application fails, because the cache is on the critical path",
   "Requests fall through to the database \u2014 slower, but still correct",
   "Writes are queued until the cache returns",
   "The database is bypassed and stale data is served"
  ],
  "answer": 1,
  "why": "In cache-aside the application checks the cache and falls back to the system of record on a miss \u2014 so a cache outage costs <strong>latency and a burst of database load, never data</strong>. A cache whose failure takes the service down is not a cache; it is a dependency, and that is a design error."
 },
 {
  "q": "A DynamoDB-backed application needs microsecond read latency without changing application code. What should be used?",
  "options": [
   "ElastiCache for Redis in front of DynamoDB",
   "DynamoDB Accelerator (DAX)",
   "A CloudFront distribution over the API",
   "DynamoDB on-demand capacity"
  ],
  "answer": 1,
  "why": "<strong>DAX</strong> is a DynamoDB-specific, write-through cache that is API-compatible with DynamoDB, so it requires essentially no code change and delivers microsecond reads. ElastiCache would work but requires implementing cache-aside yourself. On-demand capacity is a billing mode and changes nothing about latency."
 },
 {
  "q": "Why does attaching a Lambda function to a VPC potentially limit its concurrency?",
  "options": [
   "VPC functions are capped at 100 concurrent executions",
   "Each concurrent execution needs an elastic network interface, so subnet IP space becomes a limit",
   "VPC functions may only run in one availability zone",
   "The VPC's route table limits concurrent connections"
  ],
  "answer": 1,
  "why": "A VPC-attached function runs behind ENIs in your subnets, and those consume IP addresses. Undersized subnets therefore become a hard ceiling on concurrency \u2014 a genuine production surprise. Modern Lambda shares ENIs far more efficiently than it once did, but address planning still matters."
 },
 {
  "q": "Which statement about putting a Lambda function in a VPC is correct?",
  "options": [
   "It improves security when calling S3 and DynamoDB",
   "It should only be done when the function must reach resources that exist only in the VPC",
   "It is required for any function handling sensitive data",
   "It gives the function a public IP address"
  ],
  "answer": 1,
  "why": "S3, DynamoDB, SQS and most AWS services are <strong>not in your VPC</strong>, and a function calling them is no safer inside one. Attaching a VPC costs internet access (unless you add NAT), consumes ENIs and subnet addresses, and adds complexity. Do it only to reach RDS, ElastiCache or other VPC-only resources."
 },
 {
  "q": "An ElastiCache node fails and the cache is empty when it returns. Every request now misses and hits the database simultaneously. What is this called, and what mitigates it?",
  "options": [
   "Cache poisoning \u2014 mitigated by shorter TTLs",
   "A thundering herd or cache stampede \u2014 mitigated by Multi-AZ replicas and staggered TTLs",
   "Cache eviction \u2014 mitigated by a larger node",
   "A cold start \u2014 mitigated by provisioned concurrency"
  ],
  "answer": 1,
  "why": "An empty cache sending every request to the database at once is a <strong>thundering herd</strong>. Mitigations: a replica with automatic failover so the cache is never wholly lost, jittered TTLs so entries do not expire together, and request coalescing so only one caller repopulates a given key."
 },
 {
  "q": "Which caching layer is appropriate for caching whole HTTP responses close to end users worldwide?",
  "options": [
   "ElastiCache for Redis",
   "CloudFront",
   "DynamoDB DAX",
   "An Application Load Balancer"
  ],
  "answer": 1,
  "why": "<strong>CloudFront</strong> caches HTTP responses at roughly 600 edge locations, close to users. ElastiCache caches arbitrary application data beside the application, in one region. DAX caches DynamoDB items specifically. Load balancers distribute requests; they do not cache."
 },
 {
  "q": "A read-heavy RDS database is CPU-saturated. The application cannot be changed to use a cache. What is the most appropriate scaling action?",
  "options": [
   "Enable Multi-AZ",
   "Add read replicas and direct read traffic to them",
   "Enable point-in-time recovery",
   "Increase the backup retention period"
  ],
  "answer": 1,
  "why": "<strong>Read replicas</strong> add read capacity \u2014 that is precisely what they are for. Multi-AZ adds a standby that serves no traffic and solves availability, not scale. Directing reads at replicas still requires an application or proxy change, but it is the only listed option that adds capacity."
 },
 {
  "q": "Which two AWS services support gateway VPC endpoints?",
  "options": [
   "S3 and DynamoDB",
   "S3 and RDS",
   "DynamoDB and SQS",
   "All AWS services support them"
  ],
  "answer": 0,
  "why": "Gateway endpoints exist only for <strong>S3 and DynamoDB</strong>. They are free, implemented as prefix-list routes in a route table rather than as network interfaces, and cannot be reached from on-premises over VPN or Direct Connect. Every other service uses interface endpoints (PrivateLink), which bill hourly per AZ but do work over Direct Connect."
 },
 {
  "q": "An ElastiCache cluster's memory fills up. What determines which items are removed?",
  "options": [
   "Items are never removed; writes fail instead",
   "The eviction policy, commonly least-recently-used among keys with a TTL",
   "The oldest items by creation date, always",
   "Items are moved to disk automatically"
  ],
  "answer": 1,
  "why": "The <strong>eviction policy</strong> decides \u2014 typically <code>volatile-lru</code> (least recently used among keys that have a TTL) or <code>allkeys-lru</code>. A cluster with no eviction policy and no free memory will start rejecting writes, which looks like an application bug rather than a capacity problem."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
