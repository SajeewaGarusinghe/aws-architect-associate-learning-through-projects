<title>Load Balancing Exam Drill</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 02</div>
    <h1>Load Balancing Exam Drill</h1>
    <p>Twelve scenario questions on load balancers, target groups, Auto Scaling and health checks. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 02 — ALB + Auto Scaling. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "An Auto Scaling group runs four instances behind an Application Load Balancer. On one instance the web server process crashes, but the operating system keeps running normally. The load balancer stops sending it traffic, yet the Auto Scaling group never replaces it and capacity stays reduced for hours. What is the cause?",
  "options": [
   "The health check grace period is too long",
   "The Auto Scaling group's health check type is <code>EC2</code> rather than <code>ELB</code>",
   "The target group's deregistration delay is too short",
   "The minimum size of the Auto Scaling group is set too low"
  ],
  "answer": 1,
  "why": "The default health check type, <code>EC2</code>, watches only hypervisor-level status checks \u2014 it sees a healthy host and does nothing. <code>ELB</code> makes the group inherit the target group's verdict, so a failed <em>application</em> triggers replacement, not just a failed host. <strong>The target group decides who receives traffic; the Auto Scaling group decides who exists \u2014 and they only agree when health check type is <code>ELB</code>.</strong>"
 },
 {
  "q": "A web tier in private subnets must accept traffic only from an Application Load Balancer. Instances are replaced frequently by an Auto Scaling group, and a third availability zone will be added later. What inbound rule on the web tier's security group best meets this?",
  "options": [
   "Allow TCP 80 from the VPC CIDR block",
   "Allow TCP 80 from the CIDR blocks of the public subnets",
   "Allow TCP 80 with the load balancer's security group as the source",
   "Allow TCP 80 from the load balancer's private IP addresses"
  ],
  "answer": 2,
  "why": "A security group can name another security group as its source. The permission then follows the load balancer itself rather than any address range, so it survives instance replacement, subnet renumbering and the new AZ. The VPC CIDR admits every resource in the network; subnet CIDRs break when subnets change; and ALB private IPs are <strong>not stable</strong> \u2014 AWS changes them as the load balancer scales."
 },
 {
  "q": "Users report <code>503 Service Temporarily Unavailable</code> from an Application Load Balancer. The EC2 instances behind it are running and their EC2 status checks pass. What does a 503 from an ALB most directly indicate?",
  "options": [
   "The target returned a malformed response",
   "The target did not respond within the timeout",
   "There are no healthy targets registered in the target group",
   "The load balancer's security group is blocking inbound traffic"
  ],
  "answer": 2,
  "why": "An ALB returns <strong>503 when it has no healthy target</strong> to forward to. <strong>502</strong> means a target returned a malformed response; <strong>504</strong> means the target did not answer within the timeout. Worth memorising \u2014 the exam uses these codes as the entire clue. Note that passing EC2 status checks says nothing about passing the <em>target group's</em> health check."
 },
 {
  "q": "An application behind an Application Load Balancer logs the source IP of every request for audit purposes. After migrating behind the ALB, every logged address belongs to the VPC's private range. How should the application obtain the real client IP?",
  "options": [
   "Enable Proxy Protocol v2 on the target group",
   "Read the <code>X-Forwarded-For</code> request header",
   "Switch the target group's target type to <code>ip</code>",
   "Enable cross-zone load balancing"
  ],
  "answer": 1,
  "why": "An ALB terminates the client connection and opens a new one to the target, so the source IP the target sees is the load balancer's. The original client address is preserved in <code>X-Forwarded-For</code> (alongside <code>X-Forwarded-Proto</code> and <code>X-Forwarded-Port</code>). Proxy Protocol v2 is the <strong>NLB</strong> answer, not ALB \u2014 and an NLB with target type <code>instance</code> preserves the source IP natively."
 },
 {
  "q": "A workload needs to handle millions of requests per second with ultra-low latency, must expose a static IP address per availability zone for a partner's firewall allow-list, and operates over TCP rather than HTTP. Which load balancer is appropriate?",
  "options": [
   "Application Load Balancer",
   "Network Load Balancer",
   "Gateway Load Balancer",
   "Classic Load Balancer"
  ],
  "answer": 1,
  "why": "Network Load Balancer: layer 4, millions of requests per second, single-digit millisecond latency, one static IP per AZ (with optional Elastic IPs), and it preserves the source IP. The ALB is layer 7 with no static IP. Gateway Load Balancer is for inserting third-party virtual appliances such as firewalls. Classic is legacy and should never be a correct answer on a current exam."
 },
 {
  "q": "A team is creating a new Auto Scaling group and wants to use mixed instance types, Spot capacity, and enforce IMDSv2. They also want to keep previous versions of the configuration so they can roll back. What should they use?",
  "options": [
   "A launch configuration",
   "A launch template",
   "An AMI with the settings baked in",
   "A CloudFormation stack set"
  ],
  "answer": 1,
  "why": "Launch <strong>templates</strong> are versioned and support every current EC2 feature, including mixed instance policies, Spot, placement groups and metadata options such as requiring IMDSv2. Launch <strong>configurations</strong> are the deprecated predecessor: immutable, unversioned, and unable to express most of these. Any question mentioning versioning, rollback, mixed instances or Spot points to a launch template."
 },
 {
  "q": "An application's CPU utilisation varies through the day. The team wants the Auto Scaling group to keep average CPU at roughly 50% with the least configuration effort. Which scaling policy should they choose?",
  "options": [
   "Simple scaling with a cooldown period",
   "Step scaling with multiple adjustment tiers",
   "Target tracking scaling",
   "Scheduled scaling"
  ],
  "answer": 2,
  "why": "Target tracking is the simplest: name a metric and a target value \u2014 \"average CPU at 50%\" \u2014 and AWS manages the scaling activity for you. Step scaling applies different adjustments depending on how far the metric has breached, which is more control and more configuration. Simple scaling is the older single-adjustment-with-cooldown model. Scheduled scaling suits predictable time-based patterns, not variable load."
 },
 {
  "q": "After deploying a new AMI, an Auto Scaling group begins continuously launching and terminating instances. Each new instance is terminated a couple of minutes after launch and replaced. The application takes about three minutes to start serving. What is the most likely cause?",
  "options": [
   "The maximum size is set too low",
   "The health check grace period is shorter than the application's startup time",
   "The target group's health check interval is too long",
   "The desired capacity exceeds the maximum size"
  ],
  "answer": 1,
  "why": "The <strong>health check grace period</strong> is how long the group waits after launch before health checks count against an instance. Shorter than real startup time and every new instance is killed before it can pass its first check, so the group launches another \u2014 an <strong>infinite replacement loop that bills for every instance</strong>. \"Instances are constantly being terminated and relaunched\" is the exam's signature phrasing for this."
 },
 {
  "q": "During a scale-in event, users occasionally see dropped connections as instances are removed. The team wants in-flight requests to complete before an instance is removed from service. Which setting controls this?",
  "options": [
   "The Auto Scaling group's cooldown period",
   "The target group's deregistration delay",
   "The load balancer's idle timeout",
   "The health check grace period"
  ],
  "answer": 1,
  "why": "The target group's <strong>deregistration delay</strong> \u2014 also called connection draining \u2014 is how long the load balancer lets in-flight requests finish before removing a target. Default 300 seconds, configurable 0\u20133600. Cooldown governs how soon the <em>next</em> scaling activity may start; idle timeout is about how long an idle connection is held open."
 },
 {
  "q": "A web application stores user session data in memory on each EC2 instance. Users are randomly logged out whenever the Auto Scaling group scales in. Which change best resolves this while preserving the ability to scale horizontally?",
  "options": [
   "Enable sticky sessions on the target group",
   "Increase the Auto Scaling group's minimum size",
   "Move session state to ElastiCache or DynamoDB",
   "Enable scale-in protection on all instances"
  ],
  "answer": 2,
  "why": "Externalising session state makes the tier genuinely stateless, so any instance can serve any request and horizontal scaling works properly. Sticky sessions are a workaround that pins users to one instance \u2014 the session is <em>still</em> lost when that instance goes away, and load distributes unevenly. Scale-in protection prevents scaling from doing its job at all."
 },
 {
  "q": "An architect is creating an Application Load Balancer in a VPC. What is the minimum subnet requirement?",
  "options": [
   "One subnet in one availability zone",
   "Two subnets in the same availability zone",
   "Two subnets in two different availability zones",
   "One subnet per availability zone in the region"
  ],
  "answer": 2,
  "why": "An ALB requires <strong>at least two subnets in two different availability zones</strong>. That requirement is precisely what makes an ALB inherently multi-AZ \u2014 and it is why this lab has two public subnets even though only the load balancer uses them."
 },
 {
  "q": "A team compares cross-zone load balancing between an ALB and an NLB for a cost-sensitive workload. Which statement is correct?",
  "options": [
   "Both have it enabled by default and both charge for cross-AZ data transfer",
   "ALB has it always enabled at no additional cost; NLB has it disabled by default and charges for cross-AZ data when enabled",
   "ALB has it disabled by default; NLB has it always enabled and free",
   "Neither supports cross-zone load balancing without a Global Accelerator"
  ],
  "answer": 1,
  "why": "For an <strong>ALB</strong>, cross-zone load balancing is always on, cannot be disabled at the load balancer level, and incurs <strong>no</strong> cross-AZ data charge. For an <strong>NLB</strong> it is <strong>off by default</strong>, and enabling it means paying for cross-AZ data transfer. This asymmetry is a favourite cost-optimisation question."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
