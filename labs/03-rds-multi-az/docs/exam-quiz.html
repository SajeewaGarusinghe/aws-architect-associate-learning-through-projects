<style>
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#FBFAF9;
    --ink:#232F3E; --body:#3A4552; --muted:#6B7480; --line:#E4E2DE;
    --accent:#C25A08; --accent-br:#FF9900; --navy:#232F3E;
    --good:#13795B; --good-bg:#E9F6F1; --good-line:#A8DCC8;
    --bad:#B0332A; --bad-bg:#FCECEA; --bad-line:#EFBDB6;
    --shadow:0 1px 2px rgba(35,47,62,.06), 0 8px 24px rgba(35,47,62,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
      --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
      --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
      --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
      --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B24; --surface:#1D2631; --surface-2:#222C38;
    --ink:#EAEEF3; --body:#C2CBD5; --muted:#8B96A3; --line:#2F3A47;
    --accent:#FFA92B; --accent-br:#FF9900; --navy:#0F151C;
    --good:#3FD3A3; --good-bg:#123026; --good-line:#1E5943;
    --bad:#F58374; --bad-bg:#321A18; --bad-line:#6B2C25;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding-block:0 56px;padding-left:16px;padding-right:16px;}
  code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);}

  header{background:var(--navy);margin:0 -16px 28px;padding:30px 16px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent-br);}
  header::before{content:"";position:absolute;right:-100px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,153,0,.15),transparent 68%);}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-br);font-weight:600;margin-bottom:10px;}
  header h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.015em;color:#fff;text-wrap:balance;}
  header p{margin:0;color:#A8B2BD;font-size:14px;max-width:52ch;}

  .bar{display:flex;align-items:center;gap:14px;margin-top:20px;position:relative;}
  .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent-br);border-radius:3px;transition:width .35s ease;}
  .tally{font-size:12px;color:#A8B2BD;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .tally b{color:#fff;font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);}
  .qnum{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .qtext{font-size:17px;color:var(--ink);font-weight:500;margin:0 0 18px;line-height:1.5;text-wrap:pretty;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;
    font:inherit;font-size:14.5px;color:var(--body);cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .key{flex:none;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--ink);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .opt.right{background:var(--good-bg);border-color:var(--good-line);}
  .opt.right .key{background:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);}
  .opt.wrong .key{background:var(--bad);color:#fff;}

  .why{margin-top:16px;border-left:3px solid var(--accent-br);background:var(--surface-2);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;color:var(--body);}
  .why .vl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:5px;}
  .why.ok .vl{color:var(--good);}
  .why.no .vl{color:var(--bad);}
  .why strong{color:var(--ink);font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid transparent;background:var(--navy);color:#fff;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--body);}

  .done{text-align:center;padding:14px 0 4px;}
  .score{font-size:52px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .score span{color:var(--muted);font-size:24px;font-weight:600;}
  .verdict{font-size:15px;color:var(--body);margin:12px auto 0;max-width:46ch;}
  .missed{margin-top:22px;text-align:left;}
  .missed h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}
  .missed li{font-size:14px;margin-bottom:7px;color:var(--body);}
  .missed li::marker{color:var(--bad);}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);text-align:center;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:480px){ header h1{font-size:22px;} .qtext{font-size:16px;} .card{padding:18px;} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SAA-C03 · Lab 03</div>
    <h1>Database Resilience Drill</h1>
    <p>Twelve scenario questions on Multi-AZ, read replicas, backups and database security. Answer cold — the explanation appears after each choice.</p>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally"><b>0</b>/12 correct</div>
    </div>
  </header>

  <div id="stage"></div>

  <footer>Drawn from Lab 03 — RDS Multi-AZ. Reference notes: exam-notes.md</footer>
</div>

<script>
const Q = [
 {
  "q": "An application's RDS database is under heavy read load and the primary instance is CPU-saturated. The team enables Multi-AZ hoping to spread the reads. Performance does not improve. Why?",
  "options": [
   "The standby needs to be promoted before it can serve reads",
   "The Multi-AZ standby serves no traffic \u2014 it exists only for failover",
   "Multi-AZ replication is asynchronous, so the standby lags too far behind",
   "The application must be reconfigured to use the reader endpoint"
  ],
  "answer": 1,
  "why": "A Multi-AZ standby accepts <strong>no connections at all</strong>. It adds no read capacity and no throughput \u2014 you are buying a recovery time objective, nothing else. Read scaling comes from <strong>read replicas</strong>, which are asynchronous and do serve reads. <strong>Multi-AZ is for availability; read replicas are for scale</strong> \u2014 the exam tests whether you know these are different problems. There is no reader endpoint on a plain RDS instance; that is an Aurora feature."
 },
 {
  "q": "During a routine RDS maintenance window, a Multi-AZ database fails over. Users see application errors for about a minute even though the database lost no data. What is the most likely explanation?",
  "options": [
   "The standby was not fully synchronised before the failover",
   "Failover severs open connections, and the application has no retry logic",
   "DNS caching in the application prevented it from finding the new primary",
   "Multi-AZ failover requires a manual promotion step"
  ],
  "answer": 1,
  "why": "<strong>Every failover severs every open connection.</strong> Multi-AZ protects your data \u2014 it is not transparent at the TCP level. An application without connection retry and reconnect logic will surface errors to users during any failover, including routine patching, while the database itself is perfectly healthy throughout. Multi-AZ protects the data; only the client protects the user experience."
 },
 {
  "q": "A company must keep its RDS database reachable only from its application tier, which runs on EC2 instances that are replaced frequently by an Auto Scaling group. What is the best way to restrict database access?",
  "options": [
   "A security group rule allowing 5432 from the VPC CIDR block",
   "A security group rule whose source is the application tier's security group",
   "A network ACL on the database subnets allowing only the application subnets",
   "An IAM policy restricting rds:Connect to the application role"
  ],
  "answer": 1,
  "why": "A security group can name another security group as its source, so the permission follows the application tier rather than any address range \u2014 it keeps working as instances are replaced and subnets change. The VPC CIDR admits everything in the network. A NACL is coarser and stateless. IAM database authentication exists but is a separate feature that does not replace network controls."
 },
 {
  "q": "An RDS instance was created without encryption. Compliance now requires encryption at rest. What must the team do?",
  "options": [
   "Enable the StorageEncrypted setting with a modify operation",
   "Take a snapshot, copy the snapshot with encryption enabled, and restore it into a new instance",
   "Enable encryption on the DB subnet group",
   "Rotate the master key in KMS, which encrypts the existing volume"
  ],
  "answer": 1,
  "why": "<strong>Encryption must be chosen at creation.</strong> You cannot encrypt an existing unencrypted RDS instance in place. The supported path is snapshot \u2192 copy the snapshot with encryption enabled \u2192 restore that copy as a new instance \u2192 cut over. The same restriction applies in reverse: you cannot remove encryption from an encrypted instance."
 },
 {
  "q": "Which statement about RDS read replicas is correct?",
  "options": [
   "They use synchronous replication and can be failed over to automatically",
   "They use asynchronous replication, can lag, and must be promoted manually",
   "They must be in the same availability zone as the primary",
   "They cannot be created in a different region from the primary"
  ],
  "answer": 1,
  "why": "Read replicas replicate <strong>asynchronously</strong>, which means they can lag behind the primary and may be missing recent writes at the moment you promote them \u2014 and promotion is a manual action. They can live in a different AZ <em>or a different region</em>, which makes them useful for both read scaling and cross-region disaster recovery. Synchronous, automatic failover is the Multi-AZ standby's job."
 },
 {
  "q": "A team wants the RDS master password to exist nowhere in their CloudFormation template, deployment pipeline, or source control, and to be rotated automatically. What should they use?",
  "options": [
   "A CloudFormation parameter with NoEcho set to true",
   "The ManageMasterUserPassword property, which has RDS create and own a secret",
   "An SSM Parameter Store SecureString referenced by the template",
   "A hardcoded password changed manually after deployment"
  ],
  "answer": 1,
  "why": "<code>ManageMasterUserPassword: true</code> has RDS generate the password, create the Secrets Manager secret, own it, and rotate it \u2014 no human or template ever sees the value. <code>NoEcho</code> only hides a parameter in the console; the value still travels through the pipeline and shell history. A SecureString is better than plaintext but you still supply and rotate the initial value yourself."
 },
 {
  "q": "An RDS database has automated backups with a 7-day retention period. A developer accidentally deletes a table at 14:30. The team wants to recover the state from 14:25. What capability do they need?",
  "options": [
   "Restore the most recent automated snapshot",
   "Point-in-time recovery, which restores to any second within the retention period",
   "Promote the Multi-AZ standby, which retains the deleted table",
   "Restore from the read replica, which has not yet replicated the delete"
  ],
  "answer": 1,
  "why": "Automated backups enable <strong>point-in-time recovery</strong>: RDS combines daily snapshots with continuously archived transaction logs so you can restore to any second within the retention window, always into a <em>new</em> instance. A snapshot alone only gets you to the snapshot's moment. The standby is synchronous, so it deleted the table too. A replica would replicate the delete within seconds."
 },
 {
  "q": "A DB subnet group is being created for a single-AZ RDS instance. What is the minimum requirement?",
  "options": [
   "One subnet in one availability zone",
   "Subnets in at least two availability zones",
   "One private and one public subnet",
   "One subnet per availability zone in the region"
  ],
  "answer": 1,
  "why": "A DB subnet group requires subnets in <strong>at least two availability zones even for a single-AZ instance</strong>. That requirement exists so that converting to Multi-AZ later \u2014 or letting RDS move the instance during recovery \u2014 is a simple modify rather than a migration. It is a small detail that appears regularly on the exam."
 },
 {
  "q": "A workload needs a relational database that can scale reads to fifteen replicas with sub-10ms replica lag, automatically grows storage, and fails over in under 30 seconds. Which option best fits?",
  "options": [
   "RDS for PostgreSQL with Multi-AZ enabled",
   "Amazon Aurora",
   "RDS for MySQL with five read replicas",
   "DynamoDB with global tables"
  ],
  "answer": 1,
  "why": "Aurora supports up to <strong>15 read replicas</strong> with typically sub-10ms replica lag, a shared distributed storage layer that grows automatically to 128 TiB, and failover usually under 30 seconds. Standard RDS caps read replicas at 5 per instance with higher lag. DynamoDB is not relational, so it fails the requirement outright."
 },
 {
  "q": "An RDS instance is being deleted through CloudFormation. The team wants no leftover charges and no retained snapshot. Which combination achieves this?",
  "options": [
   "DeletionPolicy: Retain with DeleteAutomatedBackups: false",
   "DeletionPolicy: Delete with DeleteAutomatedBackups: true",
   "DeletionPolicy: Snapshot, which is always free",
   "Deleting the DB subnet group first, which cascades to the instance"
  ],
  "answer": 1,
  "why": "<code>DeletionPolicy: Delete</code> removes the instance without retaining a final snapshot, and <code>DeleteAutomatedBackups: true</code> removes the automated backups that would otherwise persist and bill. <code>Retain</code> deliberately leaves the instance running \u2014 and billing. <code>Snapshot</code> keeps a manual snapshot, which is charged per GB beyond the free allowance and survives the stack indefinitely."
 },
 {
  "q": "A database in a private subnet has PubliclyAccessible set to false, and its route table contains only the local route. A developer asks whether they also need a NAT gateway so the database can download engine patches. What is correct?",
  "options": [
   "Yes \u2014 RDS instances need outbound internet access for patching",
   "No \u2014 RDS is a managed service and patches through the AWS backbone, not your VPC route table",
   "Yes, but only during the maintenance window",
   "No, but only if a VPC endpoint for RDS is created"
  ],
  "answer": 1,
  "why": "RDS is managed: AWS patches the engine through its own control plane, not through your VPC's routing. A database subnet needs no NAT gateway and no internet route, which is exactly why this lab's private route table carries only the <code>local</code> route. Adding a NAT gateway here would cost $0.059/hour and buy nothing."
 },
 {
  "q": "After a Multi-AZ failover, an operations engineer checks the RDS endpoint. What has changed?",
  "options": [
   "The endpoint DNS name changes and clients must be reconfigured",
   "The endpoint name is unchanged; it now resolves to the promoted standby's address",
   "The endpoint keeps the same IP address, which is moved between availability zones",
   "A new endpoint is created and the old one returns errors until deleted"
  ],
  "answer": 1,
  "why": "Failover works by <strong>repointing a DNS record</strong>. The endpoint hostname is identical before and after; only the address it resolves to changes \u2014 in this lab, from a <code>10.40.11.x</code> in AZ-a to a <code>10.40.12.x</code> in AZ-b. No client reconfiguration is needed, though every client must reconnect because its existing connection was severed."
 }
];

const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const tally = document.getElementById("tally");
let i = 0, score = 0, missed = [];

function progress(){
  fill.style.width = (i / Q.length * 100) + "%";
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

// Options are shuffled on every run so the correct answer never settles into a
// predictable position. `order[pos]` gives the original index shown at pos.
function shuffle(item){
  const order = item.options.map((_, n) => n);
  for (let k = order.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  item.order = order;
}

function render(){
  if (i >= Q.length) return finish();
  const item = Q[i];
  if (!item.order) shuffle(item);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + Q.length + '</div>' +
    '<p class="qtext">' + item.q + '</p><div class="opts"></div>';
  const box = card.querySelector(".opts");
  item.order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "q" + i + "opt" + pos;
    b.innerHTML = '<span class="key">' + KEYS[pos] + '</span><span>' + item.options[orig] + '</span>';
    b.addEventListener("click", () => choose(card, box, pos));
    box.appendChild(b);
  });
  stage.replaceChildren(card);
  progress();
}

function choose(card, box, pickedPos){
  const item = Q[i];
  const correctPos = item.order.indexOf(item.answer);
  const correct = pickedPos === correctPos;
  if (correct) score++; else missed.push(i);

  [...box.children].forEach((b, pos) => {
    b.disabled = true;
    if (pos === correctPos) b.classList.add("right");
    else if (pos === pickedPos) b.classList.add("wrong");
  });

  const why = document.createElement("div");
  why.className = "why " + (correct ? "ok" : "no");
  why.innerHTML = '<span class="vl">' +
    (correct ? "Correct — " + KEYS[correctPos] : "Not quite — the answer is " + KEYS[correctPos]) +
    '</span>' + item.why;
  card.appendChild(why);

  const acts = document.createElement("div");
  acts.className = "actions";
  const next = document.createElement("button");
  next.className = "btn";
  next.textContent = i === Q.length - 1 ? "See results" : "Next question";
  next.addEventListener("click", () => { i++; render(); });
  acts.appendChild(next);
  card.appendChild(acts);
  next.focus();
  progress();
}

function finish(){
  fill.style.width = "100%";
  const pct = Math.round(score / Q.length * 100);
  const verdict = pct >= 85 ? "Comfortably above the ~72% needed to pass. This domain is solid."
    : pct >= 72 ? "Around passing standard. Re-read the ones you missed — the margin is thin."
    : pct >= 50 ? "The concepts are landing but the details are not yet reliable. Worth a second pass."
    : "Worth rebuilding the lab and working through the console tour before drilling again.";

  const card = document.createElement("div");
  card.className = "card done";
  let html = '<div class="score">' + pct + '<span>%</span></div>' +
    '<p class="verdict"><strong>' + score + ' of ' + Q.length + ' correct.</strong> ' + verdict + '</p>';
  if (missed.length){
    html += '<div class="missed"><h3>Review these</h3><ul>' +
      missed.map(n => '<li>Q' + (n+1) + ' — ' + Q[n].q.replace(/<[^>]+>/g, "").slice(0, 95) + '…</li>').join("") +
      '</ul></div>';
  }
  html += '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Run it again</button></div>';
  card.innerHTML = html;
  stage.replaceChildren(card);
  document.getElementById("again").addEventListener("click", () => {
    i = 0; score = 0; missed = [];
    Q.forEach(q => delete q.order);   // reshuffle every option on a fresh run
    render();
  });
  tally.innerHTML = "<b>" + score + "</b>/" + Q.length + " correct";
}

render();
</script>
